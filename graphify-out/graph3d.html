const palette = ["#4e79a7","#f28e2b","#e15759","#76b7b2","#59a14f","#edc948","#b07aa1","#ff9da7",
  "#9c755f","#bab0ac","#86bcb6","#d37295","#fabfd2","#b6992d","#499894","#8cd17d"];
const color = c => c == null ? "#888" : palette[Math.abs(c) % palette.length];
const degree = {};
DATA.links.forEach(l => { degree[l.source] = (degree[l.source] || 0) + 1; degree[l.target] = (degree[l.target] || 0) + 1; });
document.getElementById("stats").textContent = DATA.nodes.length + " nodes · " + DATA.links.length + " edges";

const info = document.getElementById("info");
let highlight = null;
const Graph = ForceGraph3D()(document.getElementById("graph"))
  .graphData(DATA)
  .backgroundColor("#0b0d12")
  .nodeLabel(n => n.label + (n.community_name ? " · " + n.community_name : ""))
  .nodeColor(n => highlight && !highlight.has(n.id) ? "rgba(120,120,120,0.15)" : color(n.community))
  .nodeVal(n => 1 + Math.sqrt(degree[n.id] || 0))
  .linkColor(l => l.confidence === "AMBIGUOUS" ? "#e15759" : l.confidence === "INFERRED" ? "#6b7a99" : "#3a4458")
  .linkOpacity(0.35)
  .linkDirectionalParticles(l => highlight && highlight.has(idOf(l.source)) && highlight.has(idOf(l.target)) ? 2 : 0)
  .onNodeClick(focus);

function idOf(x) { return typeof x === "object" ? x.id : x; }
function focus(n) {
  const near = new Set([n.id]);
  DATA.links.forEach(l => { const s = idOf(l.source), t = idOf(l.target);
    if (s === n.id) near.add(t); if (t === n.id) near.add(s); });
  highlight = near;
  Graph.nodeColor(Graph.nodeColor()).linkDirectionalParticles(Graph.linkDirectionalParticles());
  const d = 80, r = 1 + d / Math.hypot(n.x || 1, n.y || 1, n.z || 1);
  Graph.cameraPosition({ x: n.x * r, y: n.y * r, z: n.z * r }, n, 1200);
  info.style.display = "block";
  info.innerHTML = "";
  [["Node", n.label], ["Community", n.community_name || n.community], ["Type", n.type],
   ["File", n.file], ["Connections", near.size - 1]].forEach(([k, v]) => {
    const row = document.createElement("div");
    row.innerHTML = '<span class="k"></span> <span></span>';
    row.children[0].textContent = k + ":"; row.children[1].textContent = v ?? "";
    info.appendChild(row);
  });
}

document.getElementById("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) { highlight = null; info.style.display = "none"; Graph.nodeColor(Graph.nodeColor()); return; }
  const hit = DATA.nodes.find(n => n.label.toLowerCase().includes(q)) || DATA.nodes.find(n => n.id.includes(q));
  if (hit) focus(hit);
});

const comms = {};
DATA.nodes.forEach(n => { if (n.community != null) (comms[n.community] ||= { name: n.community_name, count: 0 }).count++; });
const legend = document.getElementById("legend");
Object.entries(comms).sort((a, b) => b[1].count - a[1].count).forEach(([c, v]) => {
  const row = document.createElement("div");
  row.innerHTML = '<span class="sw"></span><span></span>';
  row.children[0].style.background = color(+c);
  row.children[1].textContent = (v.name || "Community " + c) + " (" + v.count + ")";
  row.onclick = () => { highlight = new Set(DATA.nodes.filter(n => n.community == c).map(n => n.id));
    Graph.nodeColor(Graph.nodeColor()); };
  legend.appendChild(row);
});
